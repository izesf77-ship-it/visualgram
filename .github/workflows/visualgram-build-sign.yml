name: Build and Sign VisualGram IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        type: choice
        options:
          - release_arm64
          - debug_arm64
        default: release_arm64
        required: true

permissions:
  contents: read

jobs:
  build-sign-visualgram:
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      # 1. Checkout VisualGram patches (this repository)
      - name: Checkout VisualGram patches
        uses: actions/checkout@v4

      # 2. Checkout pinned official Telegram-iOS sources
      - name: Checkout pinned official Telegram
        uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/Telegram-iOS
          ref: 279f89e4d4f63f17227bf877dc3d8990f22ecd58
          path: telegram-native
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      # 3. Select Xcode (use default on macos-15 runner)
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer 2>/dev/null || sudo xcode-select -s /Applications/Xcode_15.app/Contents/Developer 2>/dev/null || true
          xcodebuild -version
          df -h .

      # 4. Install openssl@3 needed by install-signing.sh
      - name: Install signing dependency
        run: brew install openssl@3

      # 5. Install P12 certificate + provisioning profile into temporary keychain
      - name: Install signing assets
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: bash scripts/install-signing.sh

      # 6. Prepare codesigning directory structure expected by Bazel rules_apple
      - name: Prepare codesigning information directory
        run: |
          mkdir -p "$RUNNER_TEMP/native-signing/profiles" "$RUNNER_TEMP/native-signing/certs"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/native-signing/profiles/Telegram.mobileprovision"

      # 7. Prepare Telegram source: disable extensions/app groups, write configuration.json
      - name: Prepare official source and configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SIGNING_TEAM: ${{ steps.signing.outputs.team }}
          APP_BUNDLE_ID: ${{ steps.signing.outputs.bundle }}
        run: |
          python3 scripts/prepare_native.py telegram-native --configuration "$RUNNER_TEMP/native-configuration.json"
          python3 scripts/apply_native_features.py telegram-native
          python3 telegram-native/build-system/Make/PostboxImportCheck.py telegram-native

      # 8. Compile VisualGram-modified Telegram for arm64 (device) and export IPA
      - name: Compile VisualGram arm64
        working-directory: telegram-native
        run: |
          echo "=== Build environment ==="
          python3 --version
          bazel --version 2>/dev/null || which bazel || echo "Bazel not in PATH"
          free -h 2>/dev/null || vm_stat | head -5
          df -h .
          echo "=== Starting Bazel build ==="
          python3 build-system/Make/Make.py \
            --cacheDir "$RUNNER_TEMP/telegram-bazel-cache" \
            build --continueOnError \
            --configurationPath "$RUNNER_TEMP/native-configuration.json" \
            --codesigningInformationPath "$RUNNER_TEMP/native-signing" \
            --buildNumber "$((1000 + GITHUB_RUN_NUMBER))" \
            --configuration ${{ inputs.configuration }} \
            --outputBuildArtifactsPath "$RUNNER_TEMP/native-artifacts"

      # 9. Validate the produced IPA: signature, bundle ID, executable, architecture
      - name: Validate IPA signature and structure
        run: |
          IPA="$RUNNER_TEMP/native-artifacts/Telegram.ipa"
          TESTDIR="$RUNNER_TEMP/verify-ipa"
          rm -rf "$TESTDIR"
          mkdir -p "$TESTDIR"
          unzip -q "$IPA" -d "$TESTDIR"

          APP="$TESTDIR/Payload/Telegram.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Payload/Telegram.app not found in IPA"
            exit 1
          fi

          echo "=== codesign verification ==="
          codesign --verify --deep --strict "$APP"

          echo "=== Info.plist fields ==="
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist"

          echo "=== Executable file ==="
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          file "$APP/$EXECUTABLE"

          echo "=== Embedded provisioning profile ==="
          security cms -D -i "$APP/embedded.mobileprovision" > /dev/null && echo "Provisioning profile is valid"

          echo "=== IPA size ==="
          ls -lah "$IPA"

      # 10. Upload signed IPA as GitHub Actions artifact
      - name: Upload signed VisualGram IPA
        uses: actions/upload-artifact@v4
        with:
          name: VisualGram-signed-ipa
          path: ${{ runner.temp }}/native-artifacts/Telegram.ipa
          retention-days: 90
          if-no-files-found: error

      # 11. Cleanup temporary credentials and keychain (always runs)
      - name: Remove temporary credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/visualgram-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          rm -f "$RUNNER_TEMP/signing-key.pem" "$RUNNER_TEMP/signing-compatible.p12" "$RUNNER_TEMP/native-configuration.json"
          rm -rf "$RUNNER_TEMP/native-signing"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/visualgram-ci.mobileprovision"